initscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.github.jk1:gradle-license-report:3.1.4"
    }
}

gradle.projectsEvaluated {
    def root = gradle.rootProject
    root.pluginManager.apply(com.github.jk1.license.LicenseReportPlugin)
    def report = root.extensions.getByType(com.github.jk1.license.LicenseReportExtension)
    report.configurations = com.github.jk1.license.LicenseReportExtension.ALL
    report.buildScriptProjects = ([root] + root.subprojects) as org.gradle.api.Project[]
    report.excludeOwnGroup = false
    report.allowedLicensesFile = root.file("../ci/allowed-licenses.json")

    def guard = root.tasks.register("licenseDependencyBoundaries") {
        doLast {
            def testConfigurations = ["testCompileClasspath", "testRuntimeClasspath", "testAnnotationProcessor", "testDependencySources", "testImplementationDependenciesMetadata"] as Set
            def derivedTestConfigurations = ["testDependencySources", "testImplementationDependenciesMetadata"] as Set
            def violations = []
            def forbidden = { group, configuration ->
                !testConfigurations.contains(configuration) && (group == "junit" || group == "org.junit" || group.startsWith("org.junit."))
            }
            assert forbidden("org.junit.jupiter", "runtimeClasspath")
            assert forbidden("org.junit.jupiter", "contestRuntimeClasspath")
            assert !forbidden("org.junit.jupiter", "testRuntimeClasspath")
            def inTestGraph = { id, ids -> ids.contains(id) }
            assert inTestGraph("junit", ["junit"])
            assert !inTestGraph("junit", ["other"])
            root.allprojects.each { project ->
                project.configurations.findAll { it.canBeResolved }.each { configuration ->
                    configuration.incoming.resolutionResult.allComponents.each { component ->
                        def id = component.id
                        if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier && derivedTestConfigurations.contains(configuration.name) && (id.group == "junit" || id.group == "org.junit" || id.group.startsWith("org.junit."))) {
                            def testGraphs = ["testCompileClasspath", "testRuntimeClasspath"].collect { project.configurations.findByName(it) }.findAll { it != null }
                            if (!testGraphs.any { graph -> inTestGraph(id, graph.incoming.resolutionResult.allComponents.collect { it.id }) }) {
                                violations << "Test-derived dependency ${id} in ${configuration.name} not present in a test graph"
                            }
                        }
                        if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier && forbidden(id.group, configuration.name)) {
                            violations << "Unexpected non-test dependency ${id} in ${project.path}:${configuration.name}"
                        }
                    }
                }
            }
            if (!violations.isEmpty()) throw new GradleException(violations.unique().sort().join("\n"))
        }
    }
    root.tasks.register("licenseArtifactInventory") {
        doLast {
            def seen = [:]
            root.allprojects.each { project ->
                project.configurations.findAll { it.canBeResolved && it.name != "testDependencySources" }.each { configuration ->
                    configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                        def id = artifact.moduleVersion.id
                        def key = "${id.group}:${id.name}:${id.version}:${artifact.file.name}"
                        if (!seen.containsKey(key)) {
                            def file = artifact.file
                            def digest = null
                            if (file.isFile()) {
                                def md = java.security.MessageDigest.getInstance("SHA-256")
                                file.withInputStream { stream ->
                                    byte[] buffer = new byte[65536]
                                    int count
                                    while ((count = stream.read(buffer)) != -1) md.update(buffer, 0, count)
                                }
                                digest = md.digest().encodeHex().toString()
                            }
                            def directoryNotices = []
                            if (file.isDirectory() && id.group == "idea" && id.name == "ideaIC") {
                                long total = 0
                                root.fileTree(file).matching {
                                    include("LICENSE*", "NOTICE*", "license/**", "jbr/legal/**")
                                }.files.findAll { it.isFile() }.sort { it.path }.each { notice ->
                                    if (notice.name ==~ /(?i)(.*\.(txt|html|md|license)|LICENSE.*|NOTICE.*|COPYING.*|COPYRIGHT|ASSEMBLY_EXCEPTION|ADDITIONAL_LICENSE_INFO)/) {
                                        if (!notice.canonicalFile.toPath().startsWith(file.canonicalFile.toPath())) throw new GradleException("SDK notice escapes artifact")
                                        if (notice.length() > 2 * 1024 * 1024) throw new GradleException("SDK notice exceeds size limit")
                                        byte[] bytes = notice.bytes
                                        total += bytes.length
                                        if (total > 8 * 1024 * 1024 || directoryNotices.size() >= 1000) throw new GradleException("SDK notice inventory exceeds limit")
                                        def decoder = java.nio.charset.StandardCharsets.UTF_8.newDecoder().onMalformedInput(java.nio.charset.CodingErrorAction.REPORT)
                                        def text = decoder.decode(java.nio.ByteBuffer.wrap(bytes)).toString()
                                        def relative = file.toPath().relativize(notice.toPath()).toString().replace(File.separator, "/")
                                        directoryNotices << [path: relative, sha256: java.security.MessageDigest.getInstance("SHA-256").digest(bytes).encodeHex().toString(), text: text]
                                    }
                                }
                                if (directoryNotices.isEmpty()) throw new GradleException("SDK directory contains no license evidence")
                            }
                            seen[key] = [group: id.group, name: id.name, version: id.version, file: file.name, sha256: digest, directory_notices: directoryNotices, configurations: [] as Set]
                        }
                        seen[key].configurations.add("${project.path}:${configuration.name}")
                    }
                }
            }
            root.allprojects.each { project ->
                project.buildscript.configurations.findAll { it.canBeResolved }.each { configuration ->
                    configuration.incoming.resolutionResult.allComponents.each { component ->
                        def id = component.id
                        if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier && id.module.endsWith(".gradle.plugin")) {
                            def cache = new File(gradle.gradleUserHomeDir, "caches/modules-2/files-2.1").canonicalFile
                            def directory = new File(cache, "${id.group}/${id.module}/${id.version}")
                            if (!directory.canonicalFile.toPath().startsWith(cache.toPath())) throw new GradleException("Marker metadata escapes cache")
                            def poms = root.fileTree(directory).matching { include("**/*.pom") }.files
                            if (poms.isEmpty()) throw new GradleException("Resolved plugin marker has no cached POM: ${id}")
                            poms.sort { it.path }.each { pom ->
                                if (!pom.canonicalFile.toPath().startsWith(cache.toPath())) throw new GradleException("Marker POM escapes cache")
                                if (pom.length() > 65536) throw new GradleException("Marker POM exceeds size limit")
                                byte[] bytes = pom.bytes
                                def hash = java.security.MessageDigest.getInstance("SHA-256").digest(bytes).encodeHex().toString()
                                def key = "${id.group}:${id.module}:${id.version}:${pom.name}"
                                if (seen.containsKey(key) && seen[key].sha256 != hash) throw new GradleException("Ambiguous cached marker metadata: ${id}")
                                if (!seen.containsKey(key)) {
                                    def decoder = java.nio.charset.StandardCharsets.UTF_8.newDecoder().onMalformedInput(java.nio.charset.CodingErrorAction.REPORT)
                                    seen[key] = [group: id.group, name: id.module, version: id.version, file: pom.name, sha256: hash,
                                        metadata_text: decoder.decode(java.nio.ByteBuffer.wrap(bytes)).toString(), artifact_type: "plugin-marker-pom", configurations: [] as Set]
                                }
                                seen[key].configurations.add("${project.path}:buildscript:${configuration.name}")
                            }
                        }
                    }
                }
            }
            def output = new File(root.layout.buildDirectory.get().asFile, "license-inventory/artifact-fingerprints.json")
            output.parentFile.mkdirs()
            output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(seen.values()))
        }
    }
    def sdkGuard = root.tasks.register("checkReviewedSdkLicenses") {
        dependsOn("licenseArtifactInventory")
        doLast {
            root.exec {
                commandLine("python3", "-I", root.file("../ci/check-sdk-license-evidence.py"),
                    new File(root.layout.buildDirectory.get().asFile, "license-inventory/artifact-fingerprints.json"),
                    root.file("../ci/reviewed-intellij-test-licenses.json"), root.file("../ci/allowed-licenses.json"))
            }
        }
    }
    root.tasks.named("checkLicense") { dependsOn(guard, sdkGuard, root.tasks.named("checkIntellijDistribution")) }
}
