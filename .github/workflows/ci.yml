name: CI

# CI runs each subproject in its own job in parallel. Jobs run on
# every push / PR — there is no per-path gating. (Adding
# `dorny/paths-filter` per job is on the wishlist but not worth the
# extra maintenance for a four-subproject monorepo today.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # docs — every human-facing .md (root README/CHANGELOG/CONTRIBUTING,
  # lsp/ vscode/ intellij/ README+CHANGELOG, grammars/README, and their
  # ru/zh translations) is generated by @ktav-lang/polydoc from
  # root-docs/ unit trees. This job fails when a committed artifact
  # drifts from its source — which is what a hand-edit of the artifact
  # looks like. Fix the source and re-run the generator; never patch
  # the artifact.
  # ------------------------------------------------------------------
  docs:
    name: docs (generated markdown)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polydoc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: polydoc/package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Generated docs are byte-identical to their source units
        run: node scripts/build-docs.mjs --check

  # ------------------------------------------------------------------
  # grammars/ + scripts/ — JSON validation and shell regressions.
  # Runs on every change anywhere
  # since vscode/ and intellij/ both depend on it.
  # ------------------------------------------------------------------
  grammars:
    name: grammars (JSON validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `lsp/tests/spec_conformance.rs` walks `<repo>/spec/...`
          # (the ktav-lang/spec submodule). Other jobs don't read the
          # submodule directly but recursive checkout costs little.
          submodules: recursive
      - name: Validate JSON
        run: |
          set -eu
          for f in grammars/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
            echo "  ok: $f"
          done
      - name: Binary build shell regressions
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          bash -n scripts/build-binaries.sh
          bash -n scripts/tests/build-binaries.sh
          bash scripts/tests/build-binaries.sh
          bash -n intellij/dev-rebuild.sh
          bash -n scripts/tests/dev-rebuild.sh
          bash scripts/tests/dev-rebuild.sh

  # ------------------------------------------------------------------
  # lsp/ — Rust LSP server. fmt + clippy + test.
  # ------------------------------------------------------------------
  lsp:
    name: lsp / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: lsp
    steps:
      - uses: actions/checkout@v5
        with:
          # `lsp/tests/spec_conformance.rs` walks `<repo>/spec/...`
          # (the ktav-lang/spec submodule). Other jobs don't read the
          # submodule directly but recursive checkout costs little.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lsp
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked --release
      - run: cargo build --locked --release

  lsp-msrv:
    name: lsp / declared minimum Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lsp
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Read declared rust-version
        id: minimum
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["rust-version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.minimum.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lsp
      - run: cargo build --locked --release --all-targets

  # ------------------------------------------------------------------
  # vscode/ — compile/unit tests plus a headless VS Code + ktav-lsp E2E gate.
  # ------------------------------------------------------------------
  vscode:
    name: vscode (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v5
        with:
          # `lsp/tests/spec_conformance.rs` walks `<repo>/spec/...`
          # (the ktav-lang/spec submodule). Other jobs don't read the
          # submodule directly but recursive checkout costs little.
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm run test:unit --if-present
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lsp
      - name: Build current ktav-lsp
        run: cargo build --locked --release --manifest-path "$GITHUB_WORKSPACE/lsp/Cargo.toml"
      - name: VS Code extension E2E
        run: xvfb-run -a npm test
        env:
          KTAV_LSP_PATH: ${{ github.workspace }}/lsp/target/release/ktav-lsp

  # ------------------------------------------------------------------
  # intellij/ — Kotlin plugin. gradle test + verifyPlugin.
  # ------------------------------------------------------------------
  intellij:
    name: intellij (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intellij
    steps:
      - uses: actions/checkout@v5
        with:
          # `lsp/tests/spec_conformance.rs` walks `<repo>/spec/...`
          # (the ktav-lang/spec submodule). Other jobs don't read the
          # submodule directly but recursive checkout costs little.
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lsp
      - name: Build current ktav-lsp for the live platform smoke
        run: cargo build --locked --release --manifest-path "$GITHUB_WORKSPACE/lsp/Cargo.toml"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test verifyPlugin --no-daemon
        env:
          KTAV_LSP_SMOKE_BINARY: ${{ github.workspace }}/lsp/target/release/ktav-lsp
