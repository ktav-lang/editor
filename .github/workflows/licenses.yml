name: License checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lsp-licenses:
    name: LSP Cargo dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902
        with:
          manifest-path: ./lsp/Cargo.toml
          arguments: --all-features --locked
          command: check licenses

  vscode-licenses:
    name: VS Code and docs dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install without lifecycle scripts
        working-directory: vscode
        run: npm ci --ignore-scripts
      - run: node --test tests/npm-license-policy.test.mjs
      - run: node ci/check-npm-licenses.mjs
      - name: Build VSIX without publishing or signing
        working-directory: vscode
        run: npx --no-install vsce package --out "$RUNNER_TEMP/ktav.vsix"
      - name: Check VSIX dependencies and notices
        run: python ci/check-vsix-licenses.py "$RUNNER_TEMP/ktav.vsix"

  intellij-licenses:
    name: IntelliJ Gradle dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check IntelliJ distribution guard regressions
        run: python3 -I -m unittest discover -s ci -p test_intellij_distribution.py -v
      - name: Check tooling evidence guard regressions
        run: python3 -I -m unittest discover -s ci -p test_tooling_license_evidence.py -v
      - name: Check SDK evidence guard regressions
        run: python3 -I -m unittest discover -s ci -p test_sdk_license_evidence.py -v
      - name: Check Gradle configurations and buildscript dependencies
        working-directory: intellij
        run: ./gradlew --no-daemon --no-parallel --no-configure-on-demand -I ../ci/license-init.gradle licenseArtifactInventory checkLicense
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intellij-license-report
          path: |
            intellij/build/reports/dependency-license
            intellij/build/license-inventory
          if-no-files-found: warn
