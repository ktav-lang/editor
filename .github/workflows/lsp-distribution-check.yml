name: LSP distribution contract guards

on:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.source.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify required legal/source roles and plugin remapping
        run: python3 -I -m unittest discover -s ci -p 'test_lsp_distribution*.py' -v
      - name: Verify existing IntelliJ archive guards
        run: python3 -I -m unittest discover -s ci -p test_intellij_distribution.py -v
      - name: Verify idempotent notice-only source overlay
        run: python3 -I -m unittest discover -s ci -p test_lsp_notice_overlay.py -v
      - name: Pin immutable 0.8.1 audit source
        id: source
        shell: python
        run: |
          import os
          from pathlib import Path
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write('source_ref=2618bf1232f95da464a5cd407cc247ebb76acddd' + chr(10))
  gnu:
    name: GNU notices and matching source
    needs: contract
    uses: ./.github/workflows/lsp-notice-check.yml
    with:
      source_ref: ${{ needs.contract.outputs.source_ref }}
  windows:
    name: Windows source-backed notices
    needs: contract
    uses: ./.github/workflows/windows-gnullvm-check.yml
    with:
      source_ref: ${{ needs.contract.outputs.source_ref }}
  macos:
    name: macOS resource and system-input evidence
    needs: contract
    uses: ./.github/workflows/macos-notice-check.yml
    with:
      source_ref: ${{ needs.contract.outputs.source_ref }}
  organize:
    name: Preserve complete plugin binary payloads
    needs: [gnu, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: lsp-distribution-*
          path: ${{ runner.temp }}/lsp-plugin-inputs
          merge-multiple: false
      - name: Organize all six platform directories with legal/source materials
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          root = Path(os.environ['RUNNER_TEMP'])
          report = subprocess.check_output([sys.executable, '-I', 'scripts/organize_lsp_distribution.py', str(root / 'lsp-plugin-inputs'), str(root / 'lsp-plugin-bin')])
          (root / 'lsp-plugin-organization.json').write_bytes(report)
          sys.stdout.buffer.write(report)
      - uses: actions/upload-artifact@v4
        with:
          name: lsp-plugin-binaries
          path: ${{ runner.temp }}/lsp-plugin-bin/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lsp-plugin-organization
          path: ${{ runner.temp }}/lsp-plugin-organization.json
          if-no-files-found: error
  vsix:
    name: Verify actual VSIX legal and source delivery
    needs: organize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lsp-plugin-binaries
          path: vscode/bin
      - name: Restore executable modes lost by artifact transport
        run: chmod +x vscode/bin/{linux-x64,linux-arm64,darwin-x64,darwin-arm64}/ktav-lsp
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Build and package actual extension without publishing
        working-directory: vscode
        run: |
          npm ci
          npm run sync-grammars
          npm run test:unit
          npx vsce package --out ktav-license-check.vsix
      - name: Verify existing runtime guard and complete LSP payloads
        run: |
          python3 -I scripts/check_lsp_plugin_zip.py vscode/ktav-license-check.vsix vsix > "$RUNNER_TEMP/vsix-lsp-distribution.json"
          python3 -I vscode/src/test/vsix/vsix_archive.py vscode/ktav-license-check.vsix "$(node -p "require('./vscode/package.json').version")"
      - uses: actions/upload-artifact@v4
        with:
          name: lsp-verified-vsix
          path: |
            vscode/ktav-license-check.vsix
            ${{ runner.temp }}/vsix-lsp-distribution.json
          if-no-files-found: error
  intellij:
    name: Verify actual IntelliJ legal and source delivery
    needs: organize
    runs-on: ubuntu-latest
    env:
      KTAV_BUILD_STAMP: license-check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: lsp-plugin-binaries
          path: intellij/bin
      - name: Restore executable modes lost by artifact transport
        run: chmod +x intellij/bin/{linux-x64,linux-arm64,darwin-x64,darwin-arm64}/ktav-lsp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify actual plugin without publishing
        working-directory: intellij
        run: ./gradlew --no-daemon --no-parallel --no-configure-on-demand -I ../ci/license-init.gradle licenseArtifactInventory checkLicense test checkIntellijDistribution
      - name: Require all six complete platform payloads in actual ZIP
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          archives = list(Path('intellij/build/distributions').glob('*.zip'))
          if len(archives) != 1:
              raise SystemExit('expected exactly one actual IntelliJ ZIP')
          report = subprocess.check_output([sys.executable, '-I', 'scripts/check_lsp_plugin_zip.py', str(archives[0]), 'intellij'])
          (Path(os.environ['RUNNER_TEMP']) / 'intellij-lsp-distribution.json').write_bytes(report)
      - uses: actions/upload-artifact@v4
        with:
          name: lsp-verified-intellij
          path: |
            intellij/build/distributions/*.zip
            intellij/build/license-inventory/plugin-distribution.json
            ${{ runner.temp }}/intellij-lsp-distribution.json
          if-no-files-found: error
