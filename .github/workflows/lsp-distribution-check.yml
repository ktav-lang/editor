name: LSP distribution contract guards

on:
  pull_request:

permissions:
  contents: read

jobs:
  distribution-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify required legal/source roles and byte bindings
        run: python3 -I -m unittest discover -s ci -p test_lsp_distribution.py -v
